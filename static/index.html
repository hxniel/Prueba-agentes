<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de RRHH</title>
  <style>
    :root {
      --fondo: #f4f6f9;
      --panel: #ffffff;
      --texto: #1f2933;
      --suave: #616e7c;
      --borde: #dde3ea;
      --primario: #2457c5;
      --primario-texto: #ffffff;
      --burbuja-asistente: #eef2f7;
      --error-fondo: #fdecec;
      --error-borde: #e5a3a3;
      --error-texto: #8a1f1f;
      --chip: #e6eefc;
      --chip-texto: #1d4196;
      --radio: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--borde);
    }

    header h1 { margin: 0; font-size: 1.25rem; }

    header label { display: flex; align-items: center; gap: 8px; color: var(--suave); }

    select, textarea, button { font: inherit; }

    select {
      padding: 6px 10px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--panel);
      color: var(--texto);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      min-height: 0;
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bienvenida {
      color: var(--suave);
      text-align: center;
      margin: auto 0;
      line-height: 1.5;
    }

    .fila { display: flex; flex-direction: column; max-width: 78%; }
    .fila.usuario { align-self: flex-end; align-items: flex-end; }
    .fila.asistente { align-self: flex-start; align-items: flex-start; }

    .burbuja {
      padding: 10px 14px;
      border-radius: var(--radio);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .usuario .burbuja {
      background: var(--primario);
      color: var(--primario-texto);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .asistente .burbuja {
      background: var(--burbuja-asistente);
      border-bottom-left-radius: 4px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      align-items: center;
    }

    .chip {
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--chip-texto);
    }

    .duracion { font-size: 0.8rem; color: var(--suave); }

    .pensando { color: var(--suave); font-style: italic; }

    .pensando::after {
      content: "";
      display: inline-block;
      width: 1.2em;
      text-align: left;
      animation: puntos 1.2s steps(4, end) infinite;
    }

    @keyframes puntos {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }

    #error {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 20px 10px;
      padding: 10px 14px;
      border: 1px solid var(--error-borde);
      border-radius: 10px;
      background: var(--error-fondo);
      color: var(--error-texto);
    }

    #error.visible { display: flex; }

    .ejemplos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 10px;
    }

    .ejemplo {
      padding: 6px 12px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      background: var(--panel);
      color: var(--texto);
      cursor: pointer;
    }

    .ejemplo:hover:not(:disabled) { border-color: var(--primario); color: var(--primario); }

    form {
      display: flex;
      gap: 10px;
      padding: 12px 20px 16px;
      background: var(--panel);
      border-top: 1px solid var(--borde);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      color: var(--texto);
      background: var(--panel);
    }

    textarea:focus, select:focus { outline: 2px solid var(--primario); outline-offset: 1px; }

    .boton {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--primario);
      color: var(--primario-texto);
      cursor: pointer;
    }

    #error .boton { padding: 6px 14px; }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    aside {
      border-left: 1px solid var(--borde);
      background: var(--panel);
      overflow-y: auto;
      padding: 16px;
    }

    aside h2 { margin: 0 0 4px; font-size: 1rem; }

    aside .ayuda { margin: 0 0 12px; color: var(--suave); font-size: 0.85rem; }

    .turno { margin-bottom: 16px; }

    .turno h3 {
      margin: 0 0 6px;
      font-size: 0.85rem;
      color: var(--suave);
      font-weight: 600;
    }

    .paso { border: 1px solid var(--borde); border-radius: 8px; margin-bottom: 6px; }

    .paso summary {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      list-style: none;
    }

    .paso summary::-webkit-details-marker { display: none; }

    .paso .agente { font-weight: 600; }
    .paso .tipo { color: var(--suave); }

    .paso pre {
      margin: 0;
      padding: 8px 10px;
      border-top: 1px solid var(--borde);
      font-size: 0.78rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--suave);
    }

    @media (max-width: 820px) {
      body { height: auto; min-height: 100vh; }
      main { grid-template-columns: 1fr; }
      #mensajes { max-height: 60vh; }
      .fila { max-width: 92%; }
      aside { border-left: none; border-top: 1px solid var(--borde); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Asistente de RRHH</h1>
    <label>
      Empleado
      <select id="empleado" aria-label="Empleado"></select>
    </label>
  </header>

  <main>
    <section class="chat" aria-label="Conversación">
      <div id="mensajes" aria-live="polite">
        <p class="bienvenida" id="bienvenida">
          Hola, soy el asistente de Recursos Humanos.<br>
          Pregúntame sobre vacaciones, permisos, prestaciones, teletrabajo o viáticos.
        </p>
      </div>

      <div id="error" role="alert">
        <span id="error-texto"></span>
        <button type="button" class="boton" id="reintentar">Reintentar</button>
      </div>

      <div class="ejemplos">
        <button type="button" class="ejemplo">¿Cuántos días de vacaciones me quedan?</button>
        <button type="button" class="ejemplo">¿Cuál es el tope de viáticos?</button>
        <button type="button" class="ejemplo">¿Hay apoyo para guardería?</button>
      </div>

      <form id="formulario">
        <textarea id="entrada" rows="1" maxlength="1000"
          placeholder="Escribe tu pregunta… (Enter envía, Shift+Enter salto de línea)"
          aria-label="Mensaje"></textarea>
        <button type="submit" class="boton" id="enviar">Enviar</button>
      </form>
    </section>

    <aside aria-label="Trazas">
      <h2>Qué hizo el asistente</h2>
      <p class="ayuda">Agentes, herramientas y resultados de cada pregunta.</p>
      <div id="trazas"></div>
    </aside>
  </main>

  <script>
    const ICONOS = {
      delegacion: "↪️",
      llamada_tool: "🔧",
      resultado_tool: "📄",
      respuesta: "💬",
    };
    const TIPOS = {
      delegacion: "delega",
      llamada_tool: "usa herramienta",
      resultado_tool: "resultado",
      respuesta: "responde",
    };
    const ERROR_GENERICO = "El asistente no está disponible en este momento, intenta de nuevo.";

    const elementos = {
      empleado: document.getElementById("empleado"),
      mensajes: document.getElementById("mensajes"),
      bienvenida: document.getElementById("bienvenida"),
      error: document.getElementById("error"),
      errorTexto: document.getElementById("error-texto"),
      reintentar: document.getElementById("reintentar"),
      formulario: document.getElementById("formulario"),
      entrada: document.getElementById("entrada"),
      enviar: document.getElementById("enviar"),
      trazas: document.getElementById("trazas"),
      ejemplos: document.querySelectorAll(".ejemplo"),
    };

    let sessionId = null;
    let ocupado = false;
    let ultimoMensaje = null;
    let numeroTurno = 0;

    function escapar(texto) {
      return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatear(texto) {
      return escapar(texto)
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    function nombreFuente(fuente) {
      if (fuente.politica) return fuente.politica;
      const base = fuente.documento.replace(/\.md$/, "").replaceAll("_", " ");
      return base.charAt(0).toUpperCase() + base.slice(1);
    }

    function desplazarAlFinal() {
      elementos.mensajes.scrollTop = elementos.mensajes.scrollHeight;
    }

    function agregarMensajeUsuario(texto) {
      elementos.bienvenida.hidden = true;
      const fila = document.createElement("div");
      fila.className = "fila usuario";
      const burbuja = document.createElement("div");
      burbuja.className = "burbuja";
      burbuja.textContent = texto;
      fila.append(burbuja);
      elementos.mensajes.append(fila);
      desplazarAlFinal();
    }

    function agregarPensando() {
      const fila = document.createElement("div");
      fila.className = "fila asistente";
      const burbuja = document.createElement("div");
      burbuja.className = "burbuja pensando";
      burbuja.textContent = "Pensando";
      fila.append(burbuja);
      elementos.mensajes.append(fila);
      desplazarAlFinal();
      return fila;
    }

    function agregarRespuesta(datos) {
      const fila = document.createElement("div");
      fila.className = "fila asistente";
      const burbuja = document.createElement("div");
      burbuja.className = "burbuja";
      burbuja.innerHTML = formatear(datos.respuesta);
      fila.append(burbuja);

      const meta = document.createElement("div");
      meta.className = "meta";
      for (const fuente of datos.fuentes) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = `${nombreFuente(fuente)} · Art. ${fuente.articulo}`;
        chip.title = fuente.titulo;
        meta.append(chip);
      }
      const duracion = document.createElement("span");
      duracion.className = "duracion";
      duracion.textContent = `${(datos.duracion_ms / 1000).toFixed(1)} s`;
      meta.append(duracion);
      fila.append(meta);

      elementos.mensajes.append(fila);
      desplazarAlFinal();
    }

    function agregarTrazas(pregunta, pasos) {
      numeroTurno += 1;
      const turno = document.createElement("section");
      turno.className = "turno";
      const titulo = document.createElement("h3");
      titulo.textContent = `Turno ${numeroTurno}: ${pregunta}`;
      turno.append(titulo);

      for (const paso of pasos) {
        const detalle = document.createElement("details");
        detalle.className = "paso";
        const resumen = document.createElement("summary");
        const icono = document.createElement("span");
        icono.textContent = ICONOS[paso.tipo] ?? "•";
        const agente = document.createElement("span");
        agente.className = "agente";
        agente.textContent = paso.agente;
        const tipo = document.createElement("span");
        tipo.className = "tipo";
        tipo.textContent = TIPOS[paso.tipo] ?? paso.tipo;
        resumen.append(icono, agente, tipo);
        const contenido = document.createElement("pre");
        contenido.textContent = paso.detalle;
        detalle.append(resumen, contenido);
        turno.append(detalle);
      }
      elementos.trazas.prepend(turno);
    }

    function mostrarError(mensaje) {
      elementos.errorTexto.textContent = mensaje;
      elementos.error.classList.add("visible");
    }

    function ocultarError() {
      elementos.error.classList.remove("visible");
    }

    function fijarOcupado(valor) {
      ocupado = valor;
      elementos.enviar.disabled = valor;
      elementos.reintentar.disabled = valor;
      elementos.empleado.disabled = valor;
      elementos.ejemplos.forEach((boton) => { boton.disabled = valor; });
    }

    async function leerError(respuesta) {
      try {
        const cuerpo = await respuesta.json();
        if (typeof cuerpo.detail === "string") return cuerpo.detail;
        if (Array.isArray(cuerpo.detail)) return "Revisa tu mensaje: debe tener entre 1 y 1000 caracteres.";
      } catch {
        return ERROR_GENERICO;
      }
      return ERROR_GENERICO;
    }

    async function enviar(mensaje, esReintento = false) {
      const texto = mensaje.trim();
      if (!texto || ocupado) return;
      ocultarError();
      ultimoMensaje = texto;
      if (!esReintento) agregarMensajeUsuario(texto);
      fijarOcupado(true);
      const pensando = agregarPensando();

      try {
        const respuesta = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mensaje: texto,
            session_id: sessionId,
            id_empleado: elementos.empleado.value,
          }),
        });
        if (!respuesta.ok) {
          mostrarError(await leerError(respuesta));
          return;
        }
        const datos = await respuesta.json();
        sessionId = datos.session_id;
        ultimoMensaje = null;
        agregarRespuesta(datos);
        agregarTrazas(texto, datos.pasos);
      } catch {
        mostrarError(ERROR_GENERICO);
      } finally {
        pensando.remove();
        fijarOcupado(false);
        elementos.entrada.focus();
      }
    }

    function reiniciarConversacion() {
      sessionId = null;
      ultimoMensaje = null;
      numeroTurno = 0;
      ocultarError();
      elementos.mensajes.querySelectorAll(".fila").forEach((fila) => fila.remove());
      elementos.trazas.replaceChildren();
      elementos.bienvenida.hidden = false;
    }

    async function cargarEmpleados() {
      try {
        const respuesta = await fetch("/api/empleados");
        if (!respuesta.ok) throw new Error();
        const empleados = await respuesta.json();
        for (const empleado of empleados) {
          const opcion = document.createElement("option");
          opcion.value = empleado.id_empleado;
          opcion.textContent = `${empleado.nombre} (${empleado.id_empleado})`;
          elementos.empleado.append(opcion);
        }
      } catch {
        mostrarError("No se pudo cargar la lista de empleados. Recarga la página.");
      }
    }

    elementos.formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();
      const texto = elementos.entrada.value;
      if (!texto.trim() || ocupado) return;
      elementos.entrada.value = "";
      enviar(texto);
    });

    elementos.entrada.addEventListener("keydown", (evento) => {
      if (evento.key === "Enter" && !evento.shiftKey && !evento.isComposing) {
        evento.preventDefault();
        elementos.formulario.requestSubmit();
      }
    });

    elementos.ejemplos.forEach((boton) => {
      boton.addEventListener("click", () => enviar(boton.textContent));
    });

    elementos.reintentar.addEventListener("click", () => {
      if (ultimoMensaje) enviar(ultimoMensaje, true);
    });

    elementos.empleado.addEventListener("change", reiniciarConversacion);

    cargarEmpleados();
  </script>
</body>
</html>
